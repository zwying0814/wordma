# yaml-language-server: $schema=../../packages/theme/schema/theme.schema.json
id: wordma-theme-default
displayName: Default
version: 0.1.0
engines:
  wordma: ">=0.0.0"

settings:
  - key: accent
    type: color
    label: 强调色
    default: "#3563d9"
  - key: showDescription
    type: switch
    label: 显示文章摘要
    default: true

content:
  version: 1
  post:
    fields: []
  page:
    fields: []
  pageTypes:
    about:
      label: 关于页
      route: /about
      layout: page
    page:
      label: 普通页面
      route: /pages/[slug]
      layout: page

pages: []
