name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version consistency
        run: pnpm version:check

      - name: Check release tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "v$VERSION" = "$GITHUB_REF_NAME"

      - name: Cache Bun sidecar
        uses: actions/cache@v4
        with:
          path: apps/desktop/src-tauri/binaries
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/bun-version.json') }}

      - name: Fetch Bun sidecar
        run: pnpm fetch:bun

      - name: Verify Bun sidecar
        run: pnpm --filter desktop fetch:bun -- --check

      - name: Typecheck
        run: pnpm typecheck

      - name: Script and contract tests
        run: |
          pnpm test:scripts
          pnpm test:contracts

      - name: Desktop unit tests
        run: pnpm --filter desktop test

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Desktop E2E
        run: pnpm test:e2e

      - name: Stage engine resources
        run: pnpm engine:stage

      - name: Smoke test staged engine
        run: pnpm engine:smoke

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-playwright-results
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  publish-tauri:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 两个架构都在 macOS runner 上交叉编译
          - platform: macos-latest
            bun_target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin
            bundle_dir: apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle
            artifact_suffix: macos-aarch64
          - platform: macos-latest
            bun_target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin
            bundle_dir: apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle
            artifact_suffix: macos-x64
          - platform: ubuntu-22.04
            bun_target: x86_64-unknown-linux-gnu
            tauri_args: ''
            bundle_dir: apps/desktop/src-tauri/target/release/bundle
            artifact_suffix: linux-x64
          - platform: windows-latest
            bun_target: x86_64-pc-windows-msvc
            tauri_args: ''
            bundle_dir: apps/desktop/src-tauri/target/release/bundle
            artifact_suffix: windows-x64

    runs-on: ${{ matrix.platform }}

    env:
      # 让 pnpm tauri 里的自动下载脚本也使用当前矩阵目标
      BUN_TARGET: ${{ matrix.bun_target }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 需要同时装两个 target 才能交叉编译 Intel / Apple Silicon
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Bun sidecar
        uses: actions/cache@v4
        with:
          path: apps/desktop/src-tauri/binaries
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ matrix.bun_target }}-${{ hashFiles('scripts/bun-version.json') }}

      - name: Fetch Bun sidecar
        run: pnpm --filter desktop fetch:bun -- --target ${{ matrix.bun_target }}

      - name: Verify Bun sidecar
        run: pnpm --filter desktop fetch:bun -- --target ${{ matrix.bun_target }} --check

      - name: Configure Apple signing
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          # 只导出非空 secrets，避免 Tauri 把空字符串当成凭据。
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID \
            APPLE_API_KEY \
            APPLE_API_ISSUER \
            APPLE_API_KEY_PATH; do
            value="${!name}"
            if [ -n "$value" ]; then
              {
                echo "$name<<WORDMA_ENV_EOF"
                printf '%s\n' "$value"
                echo "WORDMA_ENV_EOF"
              } >> "$GITHUB_ENV"
            fi
          done

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 签名 / 公证凭据由上一步按需注入。
          # Windows 代码签名：如使用证书或 Azure Trusted Signing，在此补对应 secrets。
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: 'Wordma v__VERSION__'
          releaseBody: 'See the assets to download and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauri_args }}

      - name: Verify macOS artifacts
        if: startsWith(matrix.platform, 'macos')
        run: |
          if [ -n "$APPLE_CERTIFICATE$APPLE_SIGNING_IDENTITY" ]; then
            if [ -n "$APPLE_ID$APPLE_API_KEY" ]; then
              node scripts/verify-macos-release.mjs --target "${{ matrix.bun_target }}" --notarized
            else
              node scripts/verify-macos-release.mjs --target "${{ matrix.bun_target }}"
            fi
          else
            node scripts/verify-macos-release.mjs --target "${{ matrix.bun_target }}" --allow-unsigned
          fi

      - name: Smoke test installed macOS app
        if: startsWith(matrix.platform, 'macos')
        run: |
          node scripts/smoke-installed-engine.mjs \
            --app "${{ matrix.bundle_dir }}/macos/Wordma.app"

      - name: Verify Linux / Windows installers
        if: ${{ !startsWith(matrix.platform, 'macos') }}
        shell: bash
        run: |
          PLATFORM="${{ startsWith(matrix.platform, 'windows') && 'win32' || 'linux' }}"
          node scripts/verify-desktop-bundles.mjs \
            --bundle-dir "${{ matrix.bundle_dir }}" \
            --platform "$PLATFORM" \
            --target "${{ matrix.bun_target }}"

      - name: Smoke test installed Linux deb
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          EXTRACT="$RUNNER_TEMP/wordma-deb"
          rm -rf "$EXTRACT"
          dpkg-deb -x "${{ matrix.bundle_dir }}"/deb/*.deb "$EXTRACT"
          node scripts/smoke-installed-engine.mjs \
            --engine-dir "$EXTRACT/usr/lib/Wordma/engine" \
            --bun "$EXTRACT/usr/bin/bun"

      - name: Generate checksums
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/bundle-artifacts.mjs checksum \
            --bundle-dir "${{ matrix.bundle_dir }}" \
            --out "Wordma_${VERSION}_${{ matrix.artifact_suffix }}.sha256"

      - name: Upload checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "v$VERSION" \
            "Wordma_${VERSION}_${{ matrix.artifact_suffix }}.sha256" \
            --clobber
