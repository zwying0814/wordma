name: CI

on:
  push:
    branches:
      - next
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version consistency
        run: pnpm version:check

      - name: Cache Bun sidecar
        uses: actions/cache@v4
        with:
          path: apps/desktop/src-tauri/binaries
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/bun-version.json') }}

      - name: Fetch Bun sidecar
        run: pnpm fetch:bun

      - name: Verify Bun sidecar
        run: pnpm --filter desktop fetch:bun -- --check

      - name: Typecheck
        run: pnpm typecheck

      - name: Contract tests and fixtures
        run: pnpm test:contracts

      - name: Generate and validate JSON Schemas
        run: pnpm schema:check

      - name: Smoke test engine CLI
        run: pnpm engine --help

      - name: Smoke test engine inspect
        run: pnpm engine inspect --root fixtures/minimal --json

  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Desktop typecheck
        run: pnpm --filter desktop typecheck

      - name: Desktop unit tests
        run: pnpm --filter desktop test

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Desktop E2E
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  engine-resources:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Bun sidecar
        uses: actions/cache@v4
        with:
          path: apps/desktop/src-tauri/binaries
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/bun-version.json') }}

      - name: Fetch Bun sidecar
        run: pnpm fetch:bun

      - name: Verify Bun sidecar
        run: pnpm --filter desktop fetch:bun -- --check

      - name: Stage engine resources
        run: pnpm engine:stage

      - name: Smoke test staged engine
        run: pnpm engine:smoke

  linux-bundles:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Bun sidecar
        uses: actions/cache@v4
        with:
          path: apps/desktop/src-tauri/binaries
          key: bun-${{ runner.os }}-${{ runner.arch }}-x86_64-unknown-linux-gnu-${{ hashFiles('scripts/bun-version.json') }}

      - name: Fetch Bun sidecar
        run: pnpm --filter desktop fetch:bun -- --target x86_64-unknown-linux-gnu

      - name: Verify Bun sidecar
        run: pnpm --filter desktop fetch:bun -- --target x86_64-unknown-linux-gnu --check

      - name: Build Linux bundles
        run: pnpm --filter desktop tauri build --bundles deb,appimage

      - name: Verify Linux bundles
        run: |
          node scripts/verify-desktop-bundles.mjs \
            --bundle-dir apps/desktop/src-tauri/target/release/bundle \
            --platform linux \
            --target x86_64-unknown-linux-gnu

      - name: Generate checksums
        run: |
          node scripts/bundle-artifacts.mjs checksum \
            --bundle-dir apps/desktop/src-tauri/target/release/bundle \
            --out SHA256SUMS-linux-x64.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles-checksums
          path: SHA256SUMS-linux-x64.txt
          retention-days: 7
